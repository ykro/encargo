[project]
name = "encargo-agent"
version = "0.1.0"
description = "Encargo: a shopping agent that buys only where it can verify every condition"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk>=2.10.0",
    "google-genai>=1.63.0",
    "google-cloud-firestore>=2.21.0",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "httpx>=0.28",
    "playwright>=1.55",
    "cryptography>=46",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "respx>=0.22"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encargo"]
