      <title id="purchase-sequence-title">Secuencia de una compra</title>
      <desc id="purchase-sequence-desc">Secuencia de una compra: el agente recibe el encargo, Pulso no publica datos y Kilómetro sí; el agente llena el checklist, crea el checkout, pide aprobación, la persona firma con su passkey y Kilómetro confirma el pedido con el mandato AP2.</desc>
